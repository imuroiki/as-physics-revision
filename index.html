<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive revision for Cambridge AS Physics (9702) Exam 1: topics 1–4.2 and practical skills. Created by Claude AI, prompted and checked by SSG.">
<title>AS Physics Exam 1 Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
/* Layout: a lab-notebook revision deck — graph-paper ground, contents rail on the left,
   one learning objective per screen; the unit colour codes every objective. */
:root {
  --paper: #f5f7fb;
  --grid: rgba(31, 58, 104, 0.075);
  --panel: #ffffff;
  --ink: #142038;
  --muted: #55627a;
  --line: #d3dbe8;
  --navy: #1f3a68;
  --signal: #d4561a;
  --ok: #17784b;
  --bad: #b3261e;
  --u1: #1d5bbf;
  --u2: #0b857a;
  --u3: #c0410d;
  --u4: #7435d8;
  --up: #4a7a0c;
  --soft: rgba(31, 58, 104, 0.06);
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1321; --grid: rgba(150, 180, 235, 0.07); --panel: #131d30; --ink: #e8eef8;
    --muted: #9eabc2; --line: #2a3752; --navy: #9dbcff; --signal: #ff8b4f; --ok: #4fc78f; --bad: #ff6f62;
    --u1: #6ea5ff; --u2: #39c6b6; --u3: #ff8b4f; --u4: #b58cff; --up: #9bcc3e; --soft: rgba(157, 188, 255, 0.08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1321; --grid: rgba(150, 180, 235, 0.07); --panel: #131d30; --ink: #e8eef8;
  --muted: #9eabc2; --line: #2a3752; --navy: #9dbcff; --signal: #ff8b4f; --ok: #4fc78f; --bad: #ff6f62;
  --u1: #6ea5ff; --u2: #39c6b6; --u3: #ff8b4f; --u4: #b58cff; --up: #9bcc3e; --soft: rgba(157, 188, 255, 0.08);
  color-scheme: dark;
}

html { font-size: calc(16px * var(--scale)); height: 100%; }
body {
  height: 100%; margin: 0; background-color: var(--paper); color: var(--ink);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; font-family: var(--body); font-size: 1.06rem; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
sup, sub { font-size: 0.72em; line-height: 0; }
i { font-style: italic; }
.fr { display: inline-grid; vertical-align: middle; text-align: center; margin: 0 0.15em; line-height: 1.15; }
.fr > span { padding: 0 0.15em; font-size: 0.92em; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding-bottom: 0.08em; }

.app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
  padding-block: 0.55rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 0.6rem; margin-right: auto; min-width: 0; flex-wrap: wrap; }
.brand b { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 1.25rem; letter-spacing: 0.01em; white-space: nowrap; }
.brand span { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
.tb { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 0.35rem 0.7rem;
  font-size: 0.9rem; font-weight: 500; line-height: 1.2; text-decoration: none; color: var(--ink); display: inline-block;
}
.btn:hover { border-color: var(--navy); }
.btn.primary { background: var(--navy); color: var(--paper); border-color: var(--navy); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.jump { display: none; max-width: 100%; }

.main { display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); min-height: 0; }
.app.present .main { grid-template-columns: minmax(0, 1fr); }
.app.present .rail { display: none; }
.rail {
  overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel);
  padding: 0.8rem 0.6rem 2rem max(0.6rem, env(safe-area-inset-left, 0px));
}
.rail h3 {
  margin: 1rem 0.4rem 0.35rem; font-family: var(--display); font-stretch: 85%; font-size: 0.95rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--uc); display: flex; gap: 0.5rem; align-items: center;
}
.rail h3::before { content: ""; width: 0.65rem; height: 0.65rem; border-radius: 2px; background: var(--uc); flex: none; }
.rail h4 { margin: 0.6rem 0.4rem 0.15rem; font-size: 0.78rem; font-weight: 600; color: var(--muted); font-family: var(--mono); }
.rail a {
  display: grid; grid-template-columns: 3.4rem 1fr auto; gap: 0.3rem; align-items: baseline; padding: 0.22rem 0.4rem; border-radius: 5px;
  color: var(--ink); text-decoration: none; font-size: 0.86rem; line-height: 1.3;
}
.rail a .c { font-family: var(--mono); font-size: 0.78rem; color: var(--uc); font-weight: 600; }
.rail a .t { min-width: 0; }
.rail a .d { width: 0.6rem; height: 0.6rem; border-radius: 50%; border: 1.5px solid var(--line); align-self: center; }
.rail a.st-ok .d { background: var(--ok); border-color: var(--ok); }
.rail a.st-bad .d { background: var(--bad); border-color: var(--bad); }
.rail a.st-part .d { border-color: var(--ok); border-width: 2.5px; }
.rail a:hover { background: var(--soft); }
.rail a.cur { background: var(--soft); box-shadow: inset 3px 0 0 var(--uc); font-weight: 600; }
.rail .home { display: block; font-weight: 600; padding: 0.4rem; }

.stage { overflow-y: auto; min-width: 0; padding-block: 1.4rem 2.5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 84rem; margin: 0 auto; display: grid; gap: 1.2rem; }

/* overview */
.hero { display: grid; gap: 0.4rem; padding: 0.6rem 0 0.4rem; }
.hero .eyebrow { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); letter-spacing: 0.04em; }
.hero h1 { margin: 0; font-family: var(--display); font-stretch: 78%; font-weight: 800; font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.02; text-wrap: balance; }
.hero p { margin: 0.2rem 0 0; color: var(--muted); max-width: 62ch; }
.hero .row { display: flex; gap: 0.6rem 1rem; flex-wrap: wrap; margin-top: 0.6rem; align-items: center; }
.keys { font-size: 0.85rem; color: var(--muted); }
kbd { font-family: var(--mono); font-size: 0.8em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 0.3em; background: var(--panel); }
.units { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; }
.ucard { background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--uc); border-radius: 8px; padding: 0.9rem 1rem 1rem; display: grid; gap: 0.5rem; align-content: start; }
.ucard h2 { margin: 0; font-family: var(--display); font-stretch: 82%; font-size: 1.35rem; font-weight: 750; line-height: 1.1; }
.ucard .n { font-family: var(--mono); font-size: 0.8rem; color: var(--uc); font-weight: 600; }
.ucard .meta { font-size: 0.82rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.chip {
  font-family: var(--mono); font-size: 0.8rem; font-weight: 500; border: 1.5px solid var(--line); background: var(--panel);
  border-radius: 4px; padding: 0.12rem 0.4rem; color: var(--ink); text-decoration: none;
}
.chip:hover { border-color: var(--uc); }
.chip.st-ok { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.chip.st-bad { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.chip.st-part { border-color: var(--ok); border-width: 2.5px; }
.key { display: flex; gap: 0.9rem; flex-wrap: wrap; align-items: center; font-size: 0.85rem; color: var(--muted); }
.key .chip { pointer-events: none; }
.score { display: flex; gap: 0.5rem; flex-wrap: wrap; font-size: 0.82rem; }
.score span { font-family: var(--mono); }

/* LO screen */
.lohead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.3rem 1rem; align-items: end; border-bottom: 2px solid var(--uc); padding-bottom: 0.7rem; }
.lohead .path { grid-column: 1 / -1; font-family: var(--mono); font-size: 0.82rem; color: var(--muted); letter-spacing: 0.02em; }
.lohead .path b { color: var(--uc); font-weight: 600; }
.lohead h1 { margin: 0; font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: clamp(1.9rem, 3.6vw, 2.9rem); line-height: 1.04; text-wrap: balance; display: flex; gap: 0.8rem; align-items: baseline; flex-wrap: wrap; }
.lohead h1 .code { font-family: var(--mono); font-weight: 600; font-size: 0.62em; color: var(--panel); background: var(--uc); padding: 0.05em 0.35em; border-radius: 5px; }
.lohead .stmt { grid-column: 1 / 2; margin: 0.2rem 0 0; color: var(--muted); font-size: 0.95rem; max-width: 80ch; }
.lohead .stmt::before { content: "Syllabus: "; font-weight: 600; color: var(--ink); }
.status { font-size: 0.85rem; font-weight: 600; white-space: nowrap; }

.lobody { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.4fr); gap: 1.2rem; align-items: start; }
.lobody.nowidget { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.15rem; min-width: 0; }
.panel > h2, .check h2 {
  margin: 0 0 0.6rem; font-family: var(--display); font-stretch: 85%; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--uc);
}
.ideas ul { margin: 0; padding-left: 1.15rem; display: grid; gap: 0.55rem; }
.ideas li { padding-left: 0.15rem; }
.ideas li::marker { color: var(--uc); }
.formula { margin-top: 0.9rem; border: 1.5px dashed var(--uc); border-radius: 6px; padding: 0.6rem 0.8rem; display: grid; gap: 0.5rem; background: var(--soft); }
.formula div { font-size: 1.12rem; }

.check { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--uc); border-radius: 8px; padding: 1rem 1.15rem; display: grid; gap: 1rem; }
.check h2 { margin: 0; }
.qb { display: grid; gap: 0.6rem; }
.qb + .qb { border-top: 1px dashed var(--line); padding-top: 1rem; }
.qb .qn { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.qb .q { font-size: 1.1rem; font-weight: 500; margin: 0; max-width: 78ch; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0.5rem; }
.opt {
  display: grid; grid-template-columns: 1.9rem 1fr; gap: 0.5rem; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--panel);
  border-radius: 7px; padding: 0.5rem 0.65rem; font-size: 1rem;
}
.opt .l { font-family: var(--display); font-weight: 800; font-size: 1.15rem; width: 1.9rem; height: 1.9rem; display: grid; place-items: center; border-radius: 50%; background: var(--soft); }
.opt:hover:not([disabled]) { border-color: var(--uc); }
.opt[disabled] { cursor: default; }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
.opt.wrong .l { background: var(--bad); color: var(--panel); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); }
.opt.right .l { background: var(--ok); color: var(--panel); }
.checkfoot { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
.explain { border-top: 1px solid var(--line); padding-top: 0.6rem; font-size: 1.02rem; }
.explain .verd { font-weight: 700; margin-right: 0.3rem; }
.explain .verd.ok { color: var(--ok); }
.explain .verd.bad { color: var(--bad); }

.pager { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.8rem; align-items: center; padding-top: 0.4rem; }
.pager a { text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 0.5rem 0.8rem; display: grid; min-width: 0; }
.pager a small { font-family: var(--mono); color: var(--muted); font-size: 0.75rem; }
.pager a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.pager a.next { text-align: right; }
.pager a:hover { border-color: var(--uc); }
.pager .pos { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); text-align: center; }
.pager .ph { visibility: hidden; }

/* widgets */
.w { display: grid; gap: 0.8rem; }
.w + .w { border-top: 1px dashed var(--line); padding-top: 1rem; }
.w .ctrls { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: 0.55rem 1.3rem; }
.sl { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "lab out" "rng rng"; gap: 0.05rem 0.6rem; align-items: baseline; font-size: 0.92rem; min-width: 0; }
.sl label { grid-area: lab; min-width: 0; }
.sl output { grid-area: out; font-family: var(--mono); font-size: 0.9rem; font-weight: 600; white-space: nowrap; color: var(--uc); }
.sl input[type=range] { grid-area: rng; width: 100%; accent-color: var(--uc); margin: 0.15rem 0 0; }
.tog { grid-column: 1 / -1; display: flex; gap: 0.5rem; align-items: center; font-size: 0.92rem; font-weight: 500; }
.tog input { width: 1.1rem; height: 1.1rem; accent-color: var(--uc); }
.seg { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
.seg button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 0.88rem; }
.seg button:hover { border-color: var(--uc); }
.seg button[aria-pressed="true"] { background: var(--uc); color: var(--panel); border-color: var(--uc); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.4rem; }
.readout.wide { grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
.ro { border: 1px solid var(--line); border-radius: 6px; padding: 0.35rem 0.6rem; background: var(--soft); min-width: 0; }
.ro small { display: block; font-size: 0.78rem; color: var(--muted); }
.ro span { font-family: var(--mono); font-size: 0.98rem; font-weight: 600; overflow-wrap: anywhere; }
.ro.hl { border-color: var(--uc); box-shadow: inset 0 0 0 1px var(--uc); }
.ro.hl small { color: var(--uc); font-weight: 600; }
.note { font-size: 0.88rem; color: var(--muted); margin: 0; }
.tag { display: inline-block; font-size: 0.82rem; font-weight: 600; border-radius: 4px; padding: 0.1rem 0.45rem; }
.tag.yes { background: color-mix(in srgb, var(--ok) 15%, var(--panel)); color: var(--ok); }
.tag.no { background: color-mix(in srgb, var(--bad) 13%, var(--panel)); color: var(--bad); }

svg.fig { width: 100%; height: auto; display: block; font-family: var(--body); }
svg.fig text { fill: var(--ink); font-size: 13px; paint-order: stroke fill; stroke: var(--panel); stroke-width: 3.5px; stroke-linejoin: round; }
svg.fig text.m { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
svg.fig text.big { font-size: 15px; font-weight: 600; }
svg.fig text.c1 { fill: var(--u1); } svg.fig text.c2 { fill: var(--signal); } svg.fig text.c4 { fill: var(--ok); } svg.fig text.c5 { fill: var(--bad); } svg.fig text.c6 { fill: var(--uc); }
svg.fig .ax { stroke: var(--ink); stroke-width: 1.4; fill: none; }
svg.fig .gl { stroke: var(--line); stroke-width: 1; fill: none; }
svg.fig .curve { stroke: var(--uc); stroke-width: 2.6; fill: none; stroke-linejoin: round; }
svg.fig .curve2 { stroke: var(--signal); stroke-width: 2.6; fill: none; stroke-linejoin: round; }
svg.fig .curve1 { stroke: var(--u1); stroke-width: 2.6; fill: none; stroke-linejoin: round; }
svg.fig .tan { stroke: var(--signal); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
svg.fig .cur { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
svg.fig .areaP { fill: color-mix(in srgb, var(--uc) 22%, transparent); stroke: none; }
svg.fig .areaQ { fill: color-mix(in srgb, var(--signal) 28%, transparent); stroke: none; }
svg.fig .areaN { fill: color-mix(in srgb, var(--bad) 22%, transparent); stroke: none; }
svg.fig .band { fill: color-mix(in srgb, var(--signal) 30%, transparent); stroke: var(--signal); stroke-width: 1; }
svg.fig .dot { fill: var(--signal); stroke: var(--panel); stroke-width: 1.5; }
svg.fig .solid { fill: var(--panel); stroke: var(--ink); stroke-width: 1.6; }
svg.fig .solid2 { fill: var(--soft); stroke: var(--ink); stroke-width: 1.6; }
svg.fig .inkf { fill: var(--ink); stroke: none; }
svg.fig .ink { stroke: var(--ink); stroke-width: 1.6; fill: none; }
svg.fig .thin { stroke: var(--muted); stroke-width: 1; fill: none; }
svg.fig .dash { stroke: var(--muted); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
svg.fig .a1 { stroke: var(--u1); fill: var(--u1); }
svg.fig .a2 { stroke: var(--signal); fill: var(--signal); }
svg.fig .a3 { stroke: var(--ink); fill: var(--ink); }
svg.fig .a4 { stroke: var(--ok); fill: var(--ok); }
svg.fig .a5 { stroke: var(--bad); fill: var(--bad); }
svg.fig .a6 { stroke: var(--uc); fill: var(--uc); }
svg.fig .f1 { fill: var(--u1); stroke: none; } svg.fig .f2 { fill: var(--signal); stroke: none; } svg.fig .f3 { fill: var(--ink); stroke: none; }
svg.fig .ghost { opacity: 0.35; }
svg.fig .hatch { stroke: var(--muted); stroke-width: 1; }
svg.fig .ring { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
svg.fig .ring.c { fill: var(--soft); }
svg.fig .metal { fill: color-mix(in srgb, var(--muted) 18%, var(--panel)); stroke: var(--ink); stroke-width: 1.4; }
svg.fig .metal2 { fill: color-mix(in srgb, var(--muted) 32%, var(--panel)); stroke: var(--ink); stroke-width: 1.4; }
.figbox { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; min-width: 0; }
.cap { font-size: 0.85rem; padding: 0.35rem 0.6rem 0; color: var(--ink); }
.cap b { color: var(--uc); }

.flip { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0.5rem; }
.card {
  text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 7px; padding: 0.55rem 0.7rem; min-height: 4.6rem;
  display: grid; align-content: start; gap: 0.25rem; font-size: 0.95rem;
}
.card .f { font-weight: 500; }
.card .b { font-family: var(--mono); font-size: 1rem; color: var(--uc); font-weight: 600; visibility: hidden; }
.card .b.txt { font-family: var(--body); font-weight: 500; font-size: 0.92rem; }
.card.open { border-color: var(--uc); background: var(--soft); }
.card.open .b { visibility: visible; }
.card .hint { font-size: 0.72rem; color: var(--muted); }
.card.open .hint { display: none; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 0.4rem 0.5rem; text-align: left; vertical-align: middle; }
.tbl th { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.tbl td.num { font-family: var(--mono); }
.tbl td.hid { font-family: var(--mono); color: var(--uc); font-weight: 600; }
.tbl tr.row { cursor: pointer; }
.tbl tr.row:hover { background: var(--soft); }
.tbl tr.row td.hid span { visibility: hidden; }
.tbl tr.row.open td.hid span { visibility: visible; }
.tbl tr.row td.hid::after { content: "tap"; font-family: var(--body); font-size: 0.72rem; color: var(--muted); font-weight: 400; }
.tbl tr.row.open td.hid::after { content: ""; }
.scroll { overflow-x: auto; }

    "% *s* = {{0.5|100.0}} × 100 = **0.5%**;   % *t* = {{0.2|12.5}} × 100 = **1.6%**",
    "Dividing, so add percentages: % *v* = 0.5% + 1.6% = **2.1%**",
    "Δ*v* = 2.1% × 8.0 = 0.17 ≈ **0.2 m s^-1**",
    "*v* = **(8.0 ± 0.2) m s^-1**"],
  checks: [
    { q: "A rectangle is (5.0 ± 0.1) cm by (2.0 ± 0.1) cm. What is the absolute uncertainty in its area of 10 cm^2?", opts: ["± 0.2 cm^2", "± 0.3 cm^2", "± 0.7 cm^2", "± 1.5 cm^2"], a: 2,
      ex: "% = 2% + 5% = 7%. 7% of 10 cm^2 = **± 0.7 cm^2**." },
    { q: "Mass = (200 ± 2) g and volume = (80 ± 4) cm^3. Which is the density?", opts: ["(2.5 ± 0.05) g cm^-3", "(2.5 ± 0.1) g cm^-3", "(2.50 ± 0.15) g cm^-3", "(2.5 ± 0.6) g cm^-3"], a: 2,
      ex: "*ρ* = {{200|80}} = 2.50 g cm^-3. % = 1% + 5% = 6%. 6% of 2.50 = **0.15 g cm^-3**." }] },
{ code: "1.3.3c", sub: "1.3", title: "Uncertainty: powers and roots",
  stmt: "assess the uncertainty in a derived quantity by simple addition of absolute or percentage uncertainties (part c: powers and roots)",
  points: [
    "A power is repeated multiplication: *x*^2 = *x* × *x*, so % (*x*^2) = % *x* + % *x* = 2 × % *x*.",
    "Multiply the percentage uncertainty by the power *n*.",
    "Square root (*n* = ½): **halve** the percentage. Reciprocal 1/*x* (*n* = −1): the **same** percentage.",
    "Exact numbers such as ½, 4/3, 2 and π have no uncertainty."],
  formula: ["*z* = *x*^{n}", "{{Δ*z*|*z*}} = *n* × {{Δ*x*|*x*}}"],
  widget: ["unc_pow", "steps"], stepsTitle: "Example: a sphere has radius *r* = (2.00 ± 0.02) cm. Find *V* = {{4|3}}π*r*^3.", steps: [
    "% *r* = {{0.02|2.00}} × 100 = **1.0%**",
    "*r* is cubed: % *V* = 3 × 1.0% = **3.0%** ({{4|3}} and π are exact)",
    "*V* = {{4|3}} × π × 2.00^3 = **33.5 cm^3**",
    "Δ*V* = 3.0% × 33.5 = 1.0 cm^3, so *V* = **(34 ± 1) cm^3**"],
  checks: [
    { q: "*P* = *I*^2*R*. The uncertainty in *I* is ± 2% and in *R* is ± 3%. What is the uncertainty in *P*?", opts: ["± 5%", "± 6%", "± 7%", "± 12%"], a: 2,
      ex: "*I* is squared: 2 × 2% = 4%. Add *R*: 4% + 3% = **7%**." },
    { q: "*T* = 2π√({{*l*|*g*}}). The length *l* has an uncertainty of ± 4%. What uncertainty does this give in *T*?", opts: ["± 1%", "± 2%", "± 4%", "± 8%"], a: 1,
      ex: "Square root → halve the percentage: ½ × 4% = **2%**. 2π is exact." }] },
{ code: "1.3.3d", sub: "1.3", title: "Uncertainty: mixed combinations",
  stmt: "assess the uncertainty in a derived quantity by simple addition of absolute or percentage uncertainties (part d: combining the rules)",
  points: [
    "**Step 1:** do any additions or subtractions first and add their **absolute** uncertainties.",
    "**Step 2:** turn every absolute uncertainty into a **percentage**.",
    "**Step 3:** for multiplying, dividing and powers, add the percentages (× the power).",
    "**Step 4:** convert back to an absolute uncertainty and round it to 1 s.f.; round the value to the same decimal place."],
  formula: ["*z* = *k* × {{*A*^{p}*B*^{q}|*C*^{r}}}", "% *z* = *p* % *A* + *q* % *B* + *r* % *C*"],
  widget: ["steps", "unc_calc"], stepsTitle: "Example: *x*_{1} = (12.0 ± 0.1) cm, *x*_{2} = (52.0 ± 0.1) cm, *t* = (2.50 ± 0.05) s. Find *v* = (*x*_{2} − *x*_{1}) / *t*.", steps: [
    "Subtract first: *x*_{2} − *x*_{1} = **40.0 cm**, absolute uncertainty 0.1 + 0.1 = **0.2 cm**",
    "Convert to %: {{0.2|40.0}} × 100 = **0.5%**;   *t*: {{0.05|2.50}} × 100 = **2.0%**",
    "Dividing, so add %: 0.5% + 2.0% = **2.5%**",
    "*v* = {{40.0|2.50}} = 16.0 cm s^-1;   Δ*v* = 2.5% × 16.0 = **0.4 cm s^-1**",
    "*v* = **(16.0 ± 0.4) cm s^-1**"],
  checks: [
    { q: "*ρ* = {{*m*|*lwh*}} with % uncertainties *m*: 1%, *l*: 1%, *w*: 1%, *h*: 2%. *ρ* = 2.50 g cm^-3. Which result is correct?", opts: ["(2.50 ± 0.05) g cm^-3", "(2.5 ± 0.1) g cm^-3", "(2.5 ± 0.2) g cm^-3", "(2.5 ± 0.5) g cm^-3"], a: 1,
      ex: "% = 1 + 1 + 1 + 2 = 5%. 5% of 2.50 = 0.125 → 1 s.f. **0.1**, so (2.5 ± 0.1) g cm^-3." },
    { q: "*a* = {{*v* − *u*|*t*}} with *v* = (8.0 ± 0.2) m s^-1, *u* = (2.0 ± 0.2) m s^-1 and *t* = (3.0 ± 0.1) s. What is the percentage uncertainty in *a*?", opts: ["5.8%", "7.5%", "10%", "13%"], a: 2,
      ex: "*v* − *u* = (6.0 ± 0.4) m s^-1 → 6.7%. *t*: 3.3%. Total **10%**." }] },
/* ---------- 1.4 ---------- */
{ code: "1.4.1", sub: "1.4", title: "Scalars and vectors",
  stmt: "understand the difference between scalar and vector quantities and give examples of scalar and vector quantities included in the syllabus",
  points: [
    "**Scalar**: magnitude only.",
    "**Vector**: magnitude and direction.",
    "Distance and speed are scalars; displacement and velocity are their vector partners.",
    "Vectors must be added by drawing or by components, not just by adding the numbers."],
  widget: "vsort",
  checks: [{ q: "Which list contains **only** vector quantities?", opts: ["acceleration, force, momentum", "displacement, mass, velocity", "energy, force, weight", "speed, velocity, distance"], a: 0,
    ex: "Mass, energy, speed and distance are scalars, so only **A** works." }] },
{ code: "1.4.2", sub: "1.4", title: "Adding and subtracting vectors",
  stmt: "add and subtract coplanar vectors",
  points: [
    "Add vectors **tip-to-tail**; the resultant goes from the first tail to the last tip.",
    "To subtract, add the negative: *P* − *Q* = *P* + (−*Q*). −*Q* has the same size, opposite direction.",
    "Perpendicular vectors: size by Pythagoras, direction by tan θ.",
    "Two forces *A* and *B* give a resultant between |*A* − *B*| and *A* + *B*."],
  widget: "vecadd",
  checks: [{ q: "Forces of 6 N and 8 N act at a point. Which **cannot** be their resultant?", opts: ["1 N", "2 N", "10 N", "14 N"], a: 0,
    ex: "The resultant lies between 8 − 6 = 2 N and 8 + 6 = 14 N, so **1 N** is impossible." },
    { q: "Forces of 3.0 N east and 4.0 N north act at a point. What is the resultant?", opts: ["5.0 N at 37° north of east", "5.0 N at 53° north of east", "7.0 N at 53° north of east", "1.0 N north"], a: 1,
    ex: "√(3.0^2 + 4.0^2) = 5.0 N; tan θ = {{4.0|3.0}} → θ = **53° north of east**." }] },
{ code: "1.4.3", sub: "1.4", title: "Resolving into components",
  stmt: "represent a vector as two perpendicular components",
  points: [
    "A vector *F* at angle θ to the horizontal has components *F* cos θ (horizontal) and *F* sin θ (vertical).",
    "cos goes with the component next to the angle θ.",
    "Resolve, add the components in each direction, then recombine with Pythagoras.",
    "Used for projectiles, slopes, wires at angles and beams."],
  formula: ["*F*_{x} = *F* cos θ    *F*_{y} = *F* sin θ"],
  widget: "components",
  checks: [{ q: "A rope pulls a box with a force of 50 N at 30° above the horizontal. What is the horizontal component?", opts: ["25 N", "29 N", "43 N", "50 N"], a: 2,
    ex: "50 cos 30° = **43 N**." }] },
/* ---------- 2.1 ---------- */
{ code: "2.1.1", sub: "2.1", title: "Distance, displacement, speed, velocity, acceleration",
  stmt: "define and use distance, displacement, speed, velocity and acceleration",
  points: [
    "**Distance**: total length of the path travelled (scalar).",
    "**Displacement**: straight-line distance from start to finish in a stated direction (vector).",
    "**Speed** = distance / time.  **Velocity** = rate of change of displacement.",
    "**Acceleration** = rate of change of velocity, unit m s^-2.",
    "A deceleration is an acceleration opposite to the velocity."],
  formula: ["*v* = {{Δ*s*|Δ*t*}}", "*a* = {{Δ*v*|Δ*t*}}"],
  checks: [{ q: "A runner completes one 400 m lap in 50 s, finishing where she started. What are her average speed and average velocity?", opts: ["8 m s^-1 and 8 m s^-1", "8 m s^-1 and 0", "0 and 8 m s^-1", "0 and 0"], a: 1,
    ex: "Speed = 400 / 50 = 8 m s^-1. Displacement is zero, so average velocity is **0**." }] },
{ code: "2.1.2", sub: "2.1", title: "Motion graphs",
  stmt: "use graphical methods to represent distance, displacement, speed, velocity and acceleration",
  points: [
    "*s*–*t* graph (displacement against time): gradient = velocity. Straight line → constant velocity; curve → changing velocity.",
    "*v*–*t* graph (velocity against time): gradient = acceleration; area under the line = displacement.",
    "Horizontal line on a *v*–*t* graph → constant velocity, *a* = 0.",
    "Line below the time axis on a *v*–*t* graph → moving in the negative direction.",
    "A distance–time graph can never go down; a displacement–time graph can."],
  widget: "graphs", mode: "shape", preset: "ua",
  checks: [{ q: "A straight line on a *v*–*t* graph slopes down and crosses the time axis. What happens at the crossing?", opts: ["the acceleration is zero", "the object stops for an instant and reverses direction", "the object is back at its starting point", "the displacement is zero"], a: 1,
    ex: "*v* = 0 for an instant, then *v* becomes negative: the object **reverses**. The gradient (acceleration) is unchanged." }] },
{ code: "2.1.3", sub: "2.1", title: "Area under a *v*–*t* graph",
  stmt: "determine displacement from the area under a velocity–time graph",
  points: [
    "Displacement = area between the *v*–*t* line and the time axis.",
    "Split the area into rectangles and triangles, or use a trapezium.",
    "Area below the time axis counts as negative displacement.",
    "Units: [m s^-1][s] = [m]."],
  widget: "graphs", mode: "area", preset: "sd",
  checks: [{ q: "A car accelerates uniformly from 4.0 m s^-1 to 10.0 m s^-1 in 6.0 s. How far does it travel?", opts: ["36 m", "42 m", "60 m", "84 m"], a: 1,
    ex: "Area of trapezium = ½ × (4.0 + 10.0) × 6.0 = **42 m**." }] },
{ code: "2.1.4", sub: "2.1", title: "Gradient of an *s*–*t* graph",
  stmt: "determine velocity using the gradient of a displacement–time graph",
  points: [
    "Velocity = gradient = {{Δ*s*|Δ*t*}}.",
    "Curved graph: draw a tangent at the point and use a large triangle on the tangent.",
    "Steeper → faster. Negative gradient → moving back towards the start."],
  widget: "graphs", mode: "sgrad", preset: "ua",
  checks: [{ q: "A tangent to an *s*–*t* curve passes through (1.0 s, 2.0 m) and (4.0 s, 14.0 m). What is the velocity at that point?", opts: ["3.5 m s^-1", "4.0 m s^-1", "12 m s^-1", "14 m s^-1"], a: 1,
    ex: "Gradient = {{14.0 − 2.0|4.0 − 1.0}} = **4.0 m s^-1**." }] },
{ code: "2.1.5", sub: "2.1", title: "Gradient of a *v*–*t* graph",
  stmt: "determine acceleration using the gradient of a velocity–time graph",
  points: [
    "Acceleration = gradient = {{Δ*v*|Δ*t*}}.",
    "Straight line → uniform acceleration. Curve → changing acceleration (use a tangent).",
    "Negative gradient while *v* is positive → slowing down.",
    "Free fall without air resistance: gradient = *g* = 9.81 m s^-2."],
  widget: "graphs", mode: "vgrad", preset: "up",
  checks: [{ q: "The velocity of a trolley rises from 4.0 m s^-1 to 16.0 m s^-1 in 3.0 s. What is its acceleration?", opts: ["1.3 m s^-2", "4.0 m s^-2", "5.3 m s^-2", "12 m s^-2"], a: 1,
    ex: "*a* = {{16.0 − 4.0|3.0}} = **4.0 m s^-2**." }] },
{ code: "2.1.6a", sub: "2.1", title: "Deriving *v* = *u* + *at*",
  stmt: "derive, from the definitions of velocity and acceleration, equations that represent uniformly accelerated motion in a straight line (1 of 4)",
  points: [
    "Start from the definition of acceleration: *a* = {{*v* − *u*|*t*}}.",
    "On the *v*–*t* graph: *u* is the intercept, *a* is the gradient and the rise is *v* − *u* = *at*.",
    "Valid only for **uniform** acceleration (a straight-line *v*–*t* graph).",
    "This equation has no *s*."],
  widget: ["steps", "derive"], mode: "a", stepsTitle: "Derivation", steps: [
    "Definition of acceleration: *a* = {{*v* − *u*|*t*}}",
    "Multiply both sides by *t*: *at* = *v* − *u*",
    "Rearrange: **v = u + at**"],
  checks: [
    { q: "Which definition is the starting point for deriving *v* = *u* + *at*?", opts: ["displacement = area under the *v*–*t* graph", "acceleration = change in velocity ÷ time", "velocity = displacement ÷ time", "*F* = *ma*"], a: 1,
      ex: "*a* = {{*v* − *u*|*t*}}, the **definition of acceleration**." },
    { q: "A *v*–*t* graph is a straight line starting at 3.0 m s^-1 with gradient 2.0 m s^-2. What is the velocity at 4.0 s?", opts: ["5.0 m s^-1", "8.0 m s^-1", "11 m s^-1", "14 m s^-1"], a: 2,
      ex: "*v* = *u* + *at* = 3.0 + 2.0 × 4.0 = **11 m s^-1**." }] },
{ code: "2.1.6b", sub: "2.1", title: "Deriving *s* = ½(*u* + *v*)*t*",
  stmt: "derive, from the definitions of velocity and acceleration, equations that represent uniformly accelerated motion in a straight line (2 of 4)",
  points: [
    "Displacement = area under the *v*–*t* graph.",
    "For uniform acceleration the graph is a straight line, so the area is a **trapezium**.",
    "Area of a trapezium = ½ × (sum of the parallel sides) × width = ½(*u* + *v*) × *t*.",
    "½(*u* + *v*) is the average velocity. This equation has no *a*."],
  widget: ["steps", "derive"], mode: "b", stepsTitle: "Derivation", steps: [
    "Displacement *s* = area under the *v*–*t* graph",
    "The shape is a trapezium with parallel sides *u* and *v* and width *t*",
    "Area = ½ × (*u* + *v*) × *t*, so **s = ½(u + v)t**"],
  checks: [
    { q: "Why can *s* = ½(*u* + *v*)*t* only be used for uniform acceleration?", opts: ["the *v*–*t* graph must be a straight line, so the area is a trapezium", "the object must start from rest", "there must be no air resistance", "the velocity must be constant"], a: 0,
      ex: "Only a **straight** *v*–*t* line makes the area a trapezium with average velocity ½(*u* + *v*)." },
    { q: "*u* = 2.0 m s^-1, *v* = 8.0 m s^-1, *t* = 5.0 s. What is *s*?", opts: ["25 m", "30 m", "40 m", "50 m"], a: 0,
      ex: "*s* = ½ × (2.0 + 8.0) × 5.0 = **25 m**." }] },
{ code: "2.1.6c", sub: "2.1", title: "Deriving *s* = *ut* + ½*at*^2",
  stmt: "derive, from the definitions of velocity and acceleration, equations that represent uniformly accelerated motion in a straight line (3 of 4)",
  points: [
    "Split the area under the *v*–*t* graph into a rectangle and a triangle.",
    "Rectangle: height *u*, width *t* → *ut* (the displacement with no acceleration).",
    "Triangle: base *t*, height *v* − *u* = *at* → ½ × *t* × *at* = ½*at*^2 (the extra displacement from accelerating).",
    "This equation has no *v*."],
  widget: ["steps", "derive"], mode: "c", stepsTitle: "Derivation", steps: [
    "*s* = area under the graph = rectangle + triangle",
    "Rectangle = *u* × *t* = *ut*",
    "Triangle = ½ × *t* × (*v* − *u*) = ½ × *t* × *at* = ½*at*^2",
    "**s = ut + ½at^2**   (or: substitute *v* = *u* + *at* into *s* = ½(*u* + *v*)*t*)"],
  checks: [
    { q: "In the derivation, what does the triangle on the *v*–*t* graph represent?", opts: ["the displacement if there were no acceleration", "the extra displacement due to the acceleration, ½*at*^2", "the final velocity", "the acceleration"], a: 1,
      ex: "The rectangle is *ut*; the triangle is the **extra displacement ½*at*^2** from speeding up." },
    { q: "A car moving at 4.0 m s^-1 accelerates at 2.0 m s^-2 for 3.0 s. How far does it travel?", opts: ["9.0 m", "12 m", "21 m", "30 m"], a: 2,
      ex: "*s* = 4.0 × 3.0 + ½ × 2.0 × 3.0^2 = 12 + 9 = **21 m**." }] },
{ code: "2.1.6d", sub: "2.1", title: "Deriving *v*^2 = *u*^2 + 2*as*",
  stmt: "derive, from the definitions of velocity and acceleration, equations that represent uniformly accelerated motion in a straight line (4 of 4)",
  points: [
    "Combine *v* = *u* + *at* and *s* = ½(*u* + *v*)*t* to eliminate *t*.",
    "Use it when time is not given and not asked for.",
    "This equation has no *t*."],
  formula: ["*v* = *u* + *at*  (no *s*)", "*s* = ½(*u* + *v*)*t*  (no *a*)", "*s* = *ut* + ½*at*^2  (no *v*)", "*v*^2 = *u*^2 + 2*as*  (no *t*)"],
  widget: ["steps", "derive"], mode: "d", stepsTitle: "Derivation", steps: [
    "From *v* = *u* + *at*:  *t* = {{*v* − *u*|*a*}}",
    "Substitute into *s* = ½(*u* + *v*)*t*:  *s* = {{(*u* + *v*)(*v* − *u*)|2*a*}}",
    "(*u* + *v*)(*v* − *u*) = *v*^2 − *u*^2, so *s* = {{*v*^2 − *u*^2|2*a*}}",
    "Multiply by 2*a* and rearrange: **v^2 = u^2 + 2as**"],
  checks: [
    { q: "Which two equations are combined to derive *v*^2 = *u*^2 + 2*as*?", opts: ["*v* = *u* + *at* and *s* = ½(*u* + *v*)*t*", "*s* = *ut* + ½*at*^2 and *F* = *ma*", "*v* = {{*s*|*t*}} and *a* = {{*v*|*t*}}", "*s* = ½(*u* + *v*)*t* and *s* = *ut* + ½*at*^2"], a: 0,
      ex: "Make *t* the subject of *v* = *u* + *at* and substitute it into *s* = ½(*u* + *v*)*t*." },
    { q: "A car moving at 10 m s^-1 decelerates at 2.0 m s^-2 to rest. How far does it travel?", opts: ["5.0 m", "25 m", "50 m", "100 m"], a: 1,
      ex: "0 = 10^2 + 2 × (−2.0) × *s* → *s* = {{100|4.0}} = **25 m**." }] },
{ code: "2.1.7", sub: "2.1", title: "Solving SUVAT problems",
  stmt: "solve problems using equations that represent uniformly accelerated motion in a straight line, including the motion of bodies falling in a uniform gravitational field without air resistance",
  points: [
    "List *s*, *u*, *v*, *a*, *t*. Write the three you know and the one you want, then pick the equation without the fifth.",
    "Choose a positive direction and keep it (up = + gives *a* = −9.81 m s^-2).",
    "“From rest” or “dropped” → *u* = 0. At maximum height → *v* = 0.",
    "Without air resistance every object falls with *a* = *g* = 9.81 m s^-2, whatever its mass."],
  widget: "suvat",
  checks: [{ q: "A stone is dropped from rest from a bridge and hits the water 2.0 s later. How high is the bridge? (*g* = 9.81 m s^-2)", opts: ["9.8 m", "19.6 m", "39.2 m", "4.9 m"], a: 1,
    ex: "*s* = *ut* + ½*at*^2 = 0 + ½ × 9.81 × 2.0^2 = **19.6 m**." }] },
{ code: "2.1.8", sub: "2.1", title: "Measuring *g*",
  stmt: "describe an experiment to determine the acceleration of free fall using a falling object",
  points: [
    "An electromagnet holds a steel ball. Switching it off releases the ball and starts the timer.",
    "The ball hits a trapdoor (or passes a light gate), which stops the timer. Measure *h* from the bottom of the ball.",
    "Use several heights; repeat each time and average.",
    "*h* = ½*gt*^2, so a graph of *h* against *t*^2 is a straight line with gradient {{*g*|2}}.",
    "Use a small, dense ball so air resistance is negligible. A delay in release shows up as an intercept."],
  widget: "gexp",
  checks: [{ q: "A graph of *h* (y-axis) against *t*^2 (x-axis) has a gradient of 4.90 m s^-2. What is *g*?", opts: ["2.45 m s^-2", "4.90 m s^-2", "9.80 m s^-2", "19.6 m s^-2"], a: 2,
    ex: "Gradient = {{*g*|2}}, so *g* = 2 × 4.90 = **9.80 m s^-2**." }] },
{ code: "2.1.9", sub: "2.1", title: "Projectile motion",
  stmt: "describe and explain motion due to a uniform velocity in one direction and a uniform acceleration in a perpendicular direction",
  points: [
    "Horizontal and vertical motion are independent. **Time** links them.",
    "Horizontal: no force (no air resistance), so the velocity *u* cos θ stays constant: *x* = (*u* cos θ)*t*.",
    "Vertical: acceleration *g* downwards. Use SUVAT with initial velocity *u* sin θ.",
    "At maximum height the vertical velocity is zero; the horizontal velocity is unchanged.",
    "The path is a parabola."],
  widget: "projectile",
  checks: [{ q: "A ball is thrown horizontally at 12 m s^-1 from the top of a cliff 20 m high. How far from the base of the cliff does it land? (*g* = 9.81 m s^-2)", opts: ["12 m", "20 m", "24 m", "40 m"], a: 2,
    ex: "Vertical: 20 = ½ × 9.81 × *t*^2 → *t* = 2.02 s. Horizontal: *x* = 12 × 2.02 = **24 m**." },
    { q: "A ball is kicked at 20 m s^-1 at 30° above the horizontal from level ground. What is its time of flight?", opts: ["1.0 s", "1.8 s", "2.0 s", "3.5 s"], a: 2,
    ex: "*u* sin θ = 10 m s^-1. *t* = {{2*u* sin θ|*g*}} = {{2 × 10|9.81}} = **2.0 s**." }] },
/* ---------- 3.1 ---------- */
{ code: "3.1.1", sub: "3.1", title: "Mass and inertia",
  stmt: "understand that mass is the property of an object that resists change in motion",
  points: [
    "Mass measures **inertia**: the bigger the mass, the harder it is to change its velocity.",
    "A moving object does not need a force to keep moving. A force is needed to **change** its velocity.",
    "The same resultant force gives a smaller acceleration to a larger mass.",
    "Mass is a scalar in kg and is the same everywhere."],
  widget: "fma",
  checks: [{ q: "A space probe far from any planet moves at 2 km s^-1. Its engine is switched off. What happens next?", opts: ["it slows down and stops", "it continues at 2 km s^-1 in a straight line", "it moves in a circle", "it speeds up"], a: 1,
    ex: "No resultant force, so no change in velocity: it keeps moving at **2 km s^-1 in a straight line**." }] },
{ code: "3.1.2", sub: "3.1", title: "*F* = *ma*",
  stmt: "recall F = ma and solve problems using it, understanding that acceleration and resultant force are always in the same direction",
  points: [
    "*F* is the **resultant** force: add all the forces as vectors first.",
    "1 N is the resultant force that gives 1 kg an acceleration of 1 m s^-2.",
    "Acceleration is always in the direction of the resultant force, even when the object moves the other way (braking).",
    "Resultant force zero → acceleration zero (at rest or constant velocity)."],
  formula: ["*F* = *ma*"],
  widget: "fma",

{ code: "3.3.1", sub: "3.3", title: "Conservation of momentum",
  stmt: "state the principle of conservation of momentum",
  points: [
    "The total momentum of a system remains constant, provided **no resultant external force** acts on the system.",
    "So: total momentum before an interaction = total momentum after.",
    "It follows from Newton's laws: equal and opposite forces act for the same time, so the momentum changes cancel."],
  formula: ["*m*_{1}*u*_{1} + *m*_{2}*u*_{2} = *m*_{1}*v*_{1} + *m*_{2}*v*_{2}"],
  checks: [{ q: "Which condition is needed for the total momentum of a system to be conserved?", opts: ["the collision must be elastic", "no resultant external force acts on the system", "the objects must stick together", "kinetic energy must be conserved"], a: 1,
    ex: "Momentum is conserved when **no resultant external force** acts, whatever happens to the kinetic energy." }] },

W.prefix = (host) => {

  host.append(lad, q);
  const units = ["m", "s", "N", "J", "W", "A", "Pa", "F", "V"];
  const mant = [1.2, 2.5, 3.3, 4.7, 5.0, 6.8, 7.5, 8.2, 9.1, 15, 22, 47, 120, 330, 560];
  const sup = e => `10<sup>${String(e).replace("-", "−")}</sup>`;
  function std(m, e) { let k = 0; while (m >= 10) { m /= 10; k++; } while (m < 1) { m *= 10; k--; } return [+m.toPrecision(3), e + k]; }
  function gen() {
    const [s, , e] = P[Math.floor(Math.random() * P.length)];

W.target = (host, lo) => {
  const ctr = H("div", { class: "ctrls" }); host.appendChild(ctr);
  const sys = slider(ctr, { id: "sys", label: "Systematic error", min: 0, max: 100, step: 5, value: lo.code === "1.3.1" ? 60 : 50, unit: "%" }, draw);
  const rnd = slider(ctr, { id: "rnd", label: "Random error", min: 0, max: 100, step: 5, value: 20, unit: "%" }, draw);
  const box = H("div", { class: "figbox" }); host.appendChild(box);
  const info = H("div", { class: "readout" }); host.appendChild(info);
  const bar = H("div", { class: "seg" }); host.appendChild(bar);
  btn(bar, "Take new readings", () => { newShots(); draw(); });
  host.appendChild(H("p", { class: "note" }, "Systematic error moves the whole group away from the centre. Random error spreads the group out. The cross marks the mean."));
  let z = [];
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const newShots = () => { z = Array.from({ length: 10 }, () => [gauss(), gauss()]); };
  newShots();
  function draw() {
    box.innerHTML = "";
    const svg = S("svg", { viewBox: "0 0 420 300", class: "fig", role: "img", "aria-label": "target" }, box);
    const cx = 210, cy = 150, R = 130;
    [1, 0.75, 0.5, 0.25].forEach((f, i) => S("circle", { cx, cy, r: R * f, class: "ring" + (i === 3 ? " c" : "") }, svg));
    S("line", { x1: cx - R, x2: cx + R, y1: cy, y2: cy, class: "thin" }, svg); S("line", { y1: cy - R, y2: cy + R, x1: cx, x2: cx, class: "thin" }, svg);
    T(svg, cx, cy + R + 16, "true value at the centre", "m");
    const off = sys.v / 100 * 0.62 * R, sp = rnd.v / 100 * 0.28 * R, ang = -0.7;
    const pts = z.map(([a, b]) => [cx + off * Math.cos(ang) + sp * a, cy + off * Math.sin(ang) + sp * b]);
    pts.forEach(([x, y]) => S("circle", { cx: x, cy: y, r: 5.5, class: "dot" }, svg));
    const mx = pts.reduce((s, p) => s + p[0], 0) / pts.length, my = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    const cg = S("g", { class: "a3" }, svg);
    S("line", { x1: mx - 9, x2: mx + 9, y1: my - 9, y2: my + 9, "stroke-width": 3 }, cg); S("line", { x1: mx - 9, x2: mx + 9, y1: my + 9, y2: my - 9, "stroke-width": 3 }, cg);
    const spread = Math.sqrt(pts.reduce((s, p) => s + (p[0] - mx) ** 2 + (p[1] - my) ** 2, 0) / pts.length) / R;
    const dist = Math.hypot(mx - cx, my - cy) / R;
    const precise = spread < 0.12, accurate = dist < 0.12;
    info.innerHTML = `<div class="ro"><small>Precision</small><span class="tag ${precise ? "yes" : "no"}">${precise ? "precise" : "not precise"}</span></div>
      <div class="ro"><small>Accuracy</small><span class="tag ${accurate ? "yes" : "no"}">${accurate ? "accurate" : "not accurate"}</span></div>`;
  }
  draw();
};

W.seesaw = (host) => {

W.micro = (host) => {
  let mode = "read";

    }
    T(svg, 26, 30, "sleeve: mm marks above the line, half-mm marks below", "m", "start");
    S("path", { d: `M ${edge} 52 L ${edge + 26} 46 L 600 46 L 600 190 L ${edge + 26} 190 L ${edge} 184 Z`, class: "metal2" }, svg);
    S("rect", { x: 600, y: 80, width: 34, height: 76, rx: 6, class: "metal" }, svg); T(svg, 617, 172, "ratchet", "m");
    const c = ((reading % 0.5) + 0.5) % 0.5 * 100, sp = 8.5;
    for (let dv = Math.ceil(c - 7.5); dv <= Math.floor(c + 7.5); dv++) {
      const y = datum - (dv - c) * sp; const n = ((dv % 50) + 50) % 50;

        : `<div class="note">Find the zero error from picture 1, then correct the reading in picture 2.</div>`;
    }
  }
  build();
};

<script>

const unitOf = lo => UNITS.find(u => u.subs[lo.sub]);

let cur = -1;

function status(lo) {
  const r = results[lo.code] || {}, n = lo.checks.length;
  const ans = Object.values(r).filter(x => lo.checks[x.q]);
  if (!ans.length) return "";
  if (ans.some(x => x.c !== lo.checks[x.q].a)) return "bad";
  return ans.length >= n ? "ok" : "part";
}
function saveResult(lo, q, c) { results[lo.code] = results[lo.code] || {}; results[lo.code][q] = { q, c }; store.set("results", results); }

}

    <div class="row"><div class="key"><span class="chip st-ok">1.1.1</span> all answers correct <span class="chip st-bad">1.1.1</span> at least one wrong <span class="chip st-part">1.1.1</span> started <span class="chip">1.1.1</span> not tried</div></div>
    <div class="row"><span class="score"><span>${nOk}</span> correct · <span>${nBad}</span> to revisit · <span>${n - nOk - nBad}</span> still to finish</span><button class="btn" id="clearAll" type="button">Clear my answers</button></div><p class="credit">Created by <b>Claude AI</b> (Anthropic) · prompted and checked by <b>SSG</b></p></section><div class="units">`;
  UNITS.forEach(u => {
    const los = LOS.filter(l => u.subs[l.sub]);
    const s = los.map(status);
    html += `<article class="ucard" style="--uc:var(${u.color})"><div class="n">${u.id === "P" ? "PAPER 3" : "TOPIC " + u.id}</div><h2>${u.name}</h2><div class="meta">${Object.entries(u.subs).map(([k, v]) => u.id === "P" ? v : k + " " + v).join(" · ")}</div>
      <div class="chips">${los.map((l, i) => `<a class="chip${s[i] ? " st-" + s[i] : ""}" href="#${slug(l)}" title="${strip(l.title)}">${l.code}</a>`).join("")}</div>
      <div class="meta">${los.length} screens · ${s.filter(x => x === "ok").length} correct · ${s.filter(x => x === "bad").length} to revisit</div></article>`;
  });
  html += `</div></div>`;
  stage.innerHTML = html;
  stage.style.setProperty("--uc", "var(--navy)");
  const ca = $("#clearAll");
  ca.onclick = () => { if (ca.dataset.sure) { results = {}; store.set("results", results); overview(); } else { ca.dataset.sure = "1"; ca.textContent = "Click again to clear every answer"; } };
  markRail(); jump.value = "overview"; stage.scrollTop = 0;
  document.title = "AS Physics Exam 1 Revision";
}

const drawer = $("#drawer"), dtab = $("#dtab"), scrim = $("#scrim");
function renderDrawer() {
  const st = LOS.map(status), nOk = st.filter(x => x === "ok").length, nBad = st.filter(x => x === "bad").length;
  drawer.innerHTML = `<div class="dh"><h2>Overview</h2><button type="button" class="btn" id="dclose" aria-label="Close the overview">Close ✕</button></div>
    <div class="key"><span class="chip st-ok">✓</span> all correct <span class="chip st-bad">✗</span> revisit <span class="chip st-part">…</span> started</div>
    <div class="score"><span>${nOk}</span> correct · <span>${nBad}</span> to revisit · <span>${LOS.length - nOk - nBad}</span> still to finish</div>
    ${UNITS.map(u => { const los = LOS.filter(l => u.subs[l.sub]); return `<section class="du" style="--uc:var(${u.color})"><h3>${u.id === "P" ? "Practical skills" : u.id + " " + u.name}<span>${los.filter(l => status(l) === "ok").length}/${los.length}</span></h3>
      <div class="chips">${los.map(l => { const x = status(l); return `<a class="chip${x ? " st-" + x : ""}${LOS[cur] === l ? " here" : ""}" href="#${slug(l)}" title="${strip(l.title)}">${l.code}</a>`; }).join("")}</div></section>`; }).join("")}
    <div class="seg"><a class="btn primary" href="#overview">Open the full overview page</a></div>
    <p class="credit">Created by <b>Claude AI</b> (Anthropic) · prompted and checked by <b>SSG</b></p>`;
  $("#dclose", drawer).onclick = () => setDrawer(false);
  drawer.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setDrawer(false)));
}
function setDrawer(on) {
  if (on) renderDrawer();
  drawer.classList.toggle("open", on); drawer.setAttribute("aria-hidden", String(!on));
  dtab.setAttribute("aria-expanded", String(on)); scrim.hidden = !on;
  if (on) { const h = drawer.querySelector(".chip.here") || drawer.querySelector("#dclose"); h && h.focus({ preventScroll: true }); h && h.scrollIntoView({ block: "nearest" }); }
}
dtab.onclick = () => setDrawer(!drawer.classList.contains("open"));
scrim.onclick = () => setDrawer(false);

function markRail() {
  if (drawer.classList.contains("open")) renderDrawer();
  rail.querySelectorAll("a[data-i]").forEach(a => { const lo = LOS[+a.dataset.i], s = status(lo); a.classList.toggle("cur", +a.dataset.i === cur); a.classList.remove("st-ok", "st-bad", "st-part"); if (s) a.classList.add("st-" + s); });
  const c = rail.querySelector("a.cur"); if (c) c.scrollIntoView({ block: "nearest" });
}
const statusText = { ok: "All correct", bad: "Revisit this one", part: "Started", "": "Not tried yet" };

function show(i) {
  stopAnims();
  cur = i;
  const lo = LOS[i], u = unitOf(lo);
  stage.style.setProperty("--uc", `var(${u.color})`);
  const prev = LOS[i - 1], next = LOS[i + 1];
  const subName = u.subs[lo.sub];
  const widgets = lo.widget ? [].concat(lo.widget) : [];
  const hasW = widgets.length > 0;
  stage.innerHTML = `<div class="wrap">
    <header class="lohead">
      <div class="path"><b>${u.id === "P" ? "Practical skills" : "Topic " + u.id + " · " + u.name}</b> · ${u.id === "P" ? subName : lo.sub + " " + subName}</div>
      <h1><span class="code">${lo.code}</span><span>${md(lo.title)}</span></h1>
      <span class="status" id="stat"></span>
      <p class="stmt">${lo.stmt}</p>
    </header>
    <div class="lobody${hasW ? "" : " nowidget"}">
      <section class="panel ideas"><h2>Key ideas</h2><ul>${lo.points.map(p => `<li>${md(p)}</li>`).join("")}</ul>
        ${lo.formula ? `<div class="formula">${lo.formula.map(f => `<div>${md(f)}</div>`).join("")}</div>` : ""}
      </section>
      ${hasW ? `<section class="panel"><h2>Explore</h2>${widgets.map((w, j) => `<div class="w" id="wbox${j}"></div>`).join("")}</section>` : ""}
      ${hasW ? "" : checkHtml()}
    </div>
    ${hasW ? checkHtml() : ""}
    <nav class="pager" aria-label="Previous and next">
      ${prev ? `<a href="#${slug(prev)}" class="prev"><small>← ${prev.code}</small><span>${md(prev.title)}</span></a>` : `<span class="ph"></span>`}
      <div class="pos">${i + 1} / ${LOS.length}</div>
      ${next ? `<a href="#${slug(next)}" class="next"><small>${next.code} →</small><span>${md(next.title)}</span></a>` : `<a href="#overview" class="next"><small>done →</small><span>Back to overview</span></a>`}
    </nav><p class="credit" style="text-align:center">Created by <b>Claude AI</b> (Anthropic) · prompted and checked by <b>SSG</b></p></div>`;
  function checkHtml() {
    return `<section class="check" id="check"><h2>Check yourself</h2>${lo.checks.map((c, q) => `<div class="qb" data-q="${q}">
      ${lo.checks.length > 1 ? `<div class="qn">Question ${q + 1} of ${lo.checks.length}</div>` : ""}<p class="q">${md(c.q)}</p>
      <div class="opts">${c.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}"><span class="l">${letters[j]}</span><span>${md(o)}</span></button>`).join("")}</div>
      <div class="checkfoot"><button type="button" class="btn reveal">Show answer</button></div>
      <div class="explain" hidden></div></div>`).join("")}
      <div class="checkfoot"><span class="note">Your first answer is saved. Showing the answer before choosing counts as wrong.</span><button type="button" class="btn" id="retry">Try this screen again</button></div></section>`;
  }
  widgets.forEach((w, j) => { const box = $("#wbox" + j); try { W[w](box, lo); } catch (e) { box.innerHTML = `<p class="note">This model could not load.</p>`; console.error(e); } });
  stage.querySelectorAll(".qb").forEach(qb => {
    const q = +qb.dataset.q;
    qb.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { if ((results[lo.code] || {})[q]) return; saveResult(lo, q, +b.dataset.j); paint(); }));
    qb.querySelector(".reveal").addEventListener("click", () => { if (!(results[lo.code] || {})[q]) saveResult(lo, q, -1); paint(); });
  });
  $("#retry").onclick = () => { delete results[lo.code]; store.set("results", results); paint(); };
  paint();
  jump.value = slug(lo); stage.scrollTop = 0;
  document.title = lo.code + " · AS Physics Exam 1 Revision";
}
function paint() {
  const lo = LOS[cur]; if (!lo) return;
  const r = results[lo.code] || {};
  stage.querySelectorAll(".qb").forEach(qb => {
    const q = +qb.dataset.q, c = lo.checks[q], res = r[q], ex = qb.querySelector(".explain");
    qb.querySelectorAll(".opt").forEach(b => { const j = +b.dataset.j; b.classList.remove("right", "wrong"); b.disabled = !!res; if (res) { if (j === c.a) b.classList.add("right"); else if (j === res.c) b.classList.add("wrong"); } });
    qb.querySelector(".reveal").hidden = !!res;
    if (res) { const ok = res.c === c.a; ex.hidden = false; ex.innerHTML = `<span class="verd ${ok ? "ok" : "bad"}">${ok ? "Correct." : res.c < 0 ? "Answer shown." : "Not quite."}</span><b>Answer ${letters[c.a]}.</b> ${md(c.ex)}`; }
    else { ex.hidden = true; ex.innerHTML = ""; }
  });
  const s = status(lo), stat = $("#stat");
  if (stat) { stat.textContent = statusText[s]; stat.style.color = s === "ok" ? "var(--ok)" : s === "bad" ? "var(--bad)" : "var(--muted)"; }
  markRail();
}
function revealNext() {
  const lo = LOS[cur]; if (!lo) return;
  const r = results[lo.code] || {};
  const q = lo.checks.findIndex((c, j) => !r[j]);
  if (q >= 0) { saveResult(lo, q, -1); paint(); }
}

function route() {
  const h = location.hash.slice(1);
  const i = LOS.findIndex(l => slug(l) === h);
  if (i >= 0) show(i); else overview();
}
function go(i) { if (i < 0) { location.hash = "overview"; return; } if (i >= LOS.length) return; location.hash = slug(LOS[i]); }

/* controls */
let scale = store.get("scale", 1);
const applyScale = () => document.documentElement.style.setProperty("--scale", scale);
applyScale();
$("#btnSmall").onclick = () => { scale = Math.max(0.8, +(scale - 0.1).toFixed(2)); applyScale(); store.set("scale", scale); };
$("#btnBig").onclick = () => { scale = Math.min(1.8, +(scale + 0.1).toFixed(2)); applyScale(); store.set("scale", scale); };
$("#btnHome").onclick = () => { location.hash = "overview"; };
const btnRail = $("#btnRail");
function setPresent(on) { app.classList.toggle("present", on); btnRail.setAttribute("aria-pressed", String(on)); store.set("present", on); }
btnRail.onclick = () => setPresent(!app.classList.contains("present"));
setPresent(store.get("present", false));
const btnTheme = $("#btnTheme");
const isDark = () => { const t = document.documentElement.dataset.theme; if (t) return t === "dark"; return window.matchMedia("(prefers-color-scheme: dark)").matches; };
const syncTheme = () => { btnTheme.textContent = isDark() ? "Light" : "Dark"; };
btnTheme.onclick = () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; syncTheme(); };
syncTheme();
try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme); } catch (e) { }
$("#btnFull").onclick = () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { }
};
jump.addEventListener("change", () => { location.hash = jump.value; });

document.addEventListener("keydown", ev => {
  const t = ev.target, tag = t.tagName;
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  const typing = tag === "INPUT" && (t.type === "text" || t.type === "number") || tag === "TEXTAREA" || tag === "SELECT";
  if (typing) return;
  const onRange = tag === "INPUT" && t.type === "range";
  if ((ev.key === "ArrowRight" || ev.key === "PageDown") && !onRange) { ev.preventDefault(); go(cur + 1); }
  else if ((ev.key === "ArrowLeft" || ev.key === "PageUp") && !onRange) { ev.preventDefault(); go(cur - 1); }
  else if (ev.key === " " && tag !== "BUTTON" && cur >= 0) { ev.preventDefault(); revealNext(); }
  else if (ev.key === "ArrowDown" && !onRange && cur >= 0) { const b = [...stage.querySelectorAll(".w")].find(x => x._next); if (b) { ev.preventDefault(); b._next(); } }
  else if (ev.key === "f" || ev.key === "F") { $("#btnFull").click(); }
  else if (ev.key === "p" || ev.key === "P") { btnRail.click(); }
  else if (ev.key === "o" || ev.key === "O") { setDrawer(!drawer.classList.contains("open")); }
  else if (ev.key === "Escape" && drawer.classList.contains("open")) { setDrawer(false); }
  else if (ev.key === "h" || ev.key === "H" || ev.key === "Home") { location.hash = "overview"; }
});

buildRail();
window.addEventListener("hashchange", route);
route();
</script>

</body>
</html>
